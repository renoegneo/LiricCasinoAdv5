# ═══════════════════════════════════════════════════════
#   menus/ruleta.yml — главное меню рулетки
# ═══════════════════════════════════════════════════════

title: "<#FF00FF><bold>🌀</bold></#FF00FF> <black><bold>РУЛЕТКА</bold></black> <#FF00FF><bold>🌀</bold></#FF00FF>"
rows: 6

decorations:
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [0, 1, 2, 3, 5, 6, 7, 8, 45, 46, 47, 51, 52, 53]

# Слот для числа 0
zero-slot: 4
# Числа 1–36 размещаются начиная с этого слота (слот = начало + число)
number-start-slot: 8

wheel:
  pointer-material: GOLD_BLOCK
  colors:
    zero: LIME_CONCRETE
    red: RED_CONCRETE
    black: BLACK_CONCRETE

# Слоты для ставок на цвет (нижний ряд)
color-slots:
  red: 48
  green: 49
  black: 50

items:
  zero:
    material: LIME_DYE
    name: "<#00FF7F><bold>ЧИСЛО 0 <#A8FFC1>(Выплата x{payout})"
    lore:
      - "<#FFD700>Нажмите, чтобы сделать ставку!"

  red-number:
    name-template: "<#FF2A2A><bold>ЧИСЛО {num} <gray>(Выплата x{payout})"
    lore:
      - "<#FFD700>Нажмите, чтобы сделать ставку!"

  black-number:
    name-template: "<#666666><bold>ЧИСЛО {num} <gray>(Выплата x{payout})"
    lore:
      - "<#FFD700>Нажмите, чтобы сделать ставку!"

  color-red:
    material: RED_WOOL
    name: "<#FF2A2A><bold>СТАВКА НА КРАСНОЕ <#FF8888>(Выплата x2)"
    lore:
      - "<#FFD700>Нажмите, чтобы поставить на цвет!"

  color-green:
    material: LIME_WOOL
    name: "<#00FF7F><bold>СТАВКА НА ЗЕЛЁНОЕ <#A8FFC1>(Выплата x14)"
    lore:
      - "<#FFD700>Нажмите, чтобы поставить на цвет!"

  color-black:
    material: BLACK_WOOL
    name: "<#666666><bold>СТАВКА НА ЧЁРНОЕ <#AAAAAA>(Выплата x2)"
    lore:
      - "<#FFD700>Нажмите, чтобы поставить на цвет!"
