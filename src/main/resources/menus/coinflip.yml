# Меню «Орёл или решка»
title: "<dark_gray><bold>Орёл или решка</bold></dark_gray> <dark_gray>▸</dark_gray> <white>Игры"
rows: 6

# Кнопка создания игры
create-btn:
  slot: 4
  material: NETHER_STAR
  name: "<#00FF7F><bold>✚ Создать игру</bold>"
  lore:
    - "<gray>Нажмите, чтобы создать игру со ставкой."
    - ""
    - "<#FFD700>❱ Введите сумму в чате."
    - "<gray>Форматы: <white>1k <gray>· <white>5m <gray>· <white>2b <gray>· <white>1t"

# Кнопка обновления
refresh-btn:
  slot: 49
  material: COMPASS
  name: "<white><bold>↺ Обновить</bold>"
  lore:
    - "<gray>Нажмите, чтобы обновить список."

# Когда нет доступных игр
no-games:
  slot: 22
  material: BELL
  name: "<#FF5555>| Игры <dark_gray>→ <red><bold>Нет доступных</bold>"
  lore:
    - "<gray>Предмет | Описание"
    - ""
    - "<#5555FF>ⓘ <gray>Информация:"
    - "<gray>Сейчас нет открытых игр."
    - "<gray>Зайдите позже или создайте"
    - "<gray>собственную игру."
    - ""
    - "<red>✦ <white>Команда: <#FF5555>/cf create <сумма>"

# Слоты, в которых отображаются игры
games-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]

# Формат предмета игры
game-item:
  name: "<light_purple>Game <dark_gray>→ <white>%creator%"
  lore:
    - "<gray>Кнопка | Игра"
    - ""
    - "<gray> Описание:"
    - "<gray>· Ставка: <#FFD700>%amount%"
    - ""
    - "%click_action%"
  click-join: "<#00FF7F>✔ Нажмите, чтобы присоединиться!"
  click-cancel: "<red>✗ Нажмите, чтобы отменить!"

# ─────────────────────────────────────────────────────────────
#  ДЕКОРАЦИИ
# ─────────────────────────────────────────────────────────────
decorations:
  # Чёрная верхняя полоса
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [0, 1, 2, 3, 5, 6, 7, 8] # В слоте 4 находится create-btn
  # Серые боковые рамки
  - material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: [9, 17, 18, 26, 27, 35, 36, 44]
  # Чёрная нижняя полоса
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [45, 46, 47, 48, 50, 51, 52, 53] # В слоте 49 находится refresh-btn
