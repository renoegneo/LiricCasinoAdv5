# ═══════════════════════════════════════════════════════
#   menus/apuesta_ruleta.yml — меню суммы ставки в рулетке
# ═══════════════════════════════════════════════════════

title: "<black><bold>Ставка ➔ {target}"
rows: 3

decorations:
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 19, 20, 21, 23, 24, 25, 26]
  - material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: [9, 17]

buttons:
  # Кнопки уменьшения ставки (слоты 10, 11, 12)
  minus-big:
    slot: 10
    material: RED_DYE
    label: "-10k"
    amount: -10000.0
    color: "<#FF3333>"
  minus-medium:
    slot: 11
    material: RED_DYE
    label: "-1000"
    amount: -1000.0
    color: "<#FF3333>"
  minus-small:
    slot: 12
    material: RED_DYE
    label: "-100"
    amount: -100.0
    color: "<#FF3333>"

  # Кнопки увеличения ставки (слоты 14, 15, 16)
  plus-small:
    slot: 14
    material: LIME_DYE
    label: "+100"
    amount: 100.0
    color: "<#00FF7F>"
  plus-medium:
    slot: 15
    material: LIME_DYE
    label: "+1000"
    amount: 1000.0
    color: "<#00FF7F>"
  plus-big:
    slot: 16
    material: LIME_DYE
    label: "+10k"
    amount: 10000.0
    color: "<#00FF7F>"

  custom-bet:
    slot: 4
    material: PAPER
    name: "<#FFD700>Своя ставка"

  # Максимальная ставка (слот 22)
  max-bet:
    slot: 22
    material: GOLD_BLOCK
    name: "<#FFD700><bold>✦ МАКСИМАЛЬНАЯ СТАВКА! ✦"
    lore:
      - "<gray>Поставить максимум: <#00FF7F>${max}"

  # Назад (слот 18)
  back:
    slot: 18
    material: ARROW
    name: "<#FF3333><bold>Назад"

  # Подтвердить (слот 13 — обновляется динамически)
  confirm:
    confirm-name: "<#00FF7F><bold>✔ ПОДТВЕРДИТЬ СТАВКУ"
    lore-target: "<gray>Цель: <white>{target}"
    lore-total: "<gray>Всего на столе: <#00FF7F>${amount}"
    lore-click: ""
    lore-action: "<#FFD700>Нажмите, чтобы сделать ставку!"

error:
  limit-msg: "<#FF3333><bold>ДОСТИГНУТ ЛИМИТ ({max})!"
  limit-lore: "<gray>Нельзя поставить больше {max}."
  no-funds-msg: "<#FF3333><bold>НЕДОСТАТОЧНО СРЕДСТВ!"
  no-funds-lore: "<gray>У вас недостаточно денег."
  min-msg: "<#FF3333><bold>ДОСТИГНУТА МИНИМАЛЬНАЯ СТАВКА!"
  min-lore: "<gray>Ставка не может быть меньше 0."
