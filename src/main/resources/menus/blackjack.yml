title: "<#FF0000><bold>♠ БЛЭКДЖЕК 21 ♠</bold></#FF0000>"
multi-title: "<#FF0000><bold>♠ VIP-СТОЛ БЛЭКДЖЕКА ♠</bold></#FF0000>"
rows: 6

items:
  filler:
    material: GREEN_STAINED_GLASS_PANE
    name: " "
  multi-filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  dealer-head:
    material: SKELETON_SKULL
    name: "<#FF5555><bold>ДИЛЕР</bold>"
    lore:
      - "<gray>Очки: <white>{score}"
  player-head:
    material: PLAYER_HEAD
    name: "<#00FF7F><bold>ВАШИ КАРТЫ</bold>"
    lore:
      - "<gray>Очки: <white>{score}"
      - "<gray>Ставка: <#FFD700>${bet}"
  multi-player-head:
    material: PLAYER_HEAD
    name: "{color}<bold>{name}"
    lore:
      - "<gray>Ставка: <#FFD700>${bet}"
      - "<gray>Очки: <white>{score}"
      - "{state}"
  your-cards:
    material: DIAMOND
    name: "<#00FFFF><bold>ВАШИ КАРТЫ</bold>"
    lore:
      - "<gray>Всего очков: <white>{score}"
  hit:
    material: LIME_DYE
    name: "<#00FF7F><bold>✚ ВЗЯТЬ КАРТУ</bold>"
  stand:
    material: RED_DYE
    name: "<#FF5555><bold>✋ ХВАТИТ</bold>"
  double:
    material: GOLD_BLOCK
    name: "<#FFD700><bold>💰 УДВОИТЬ СТАВКУ</bold>"
    lore:
      - "<gray>Удвойте ставку (<#FFD700>${bet}</#FFD700>), возьмите"
      - "<gray>РОВНО 1 карту и завершите ход."
