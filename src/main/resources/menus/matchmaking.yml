title: "<gold><bold>Игровое лобби</bold>"
rows: 6

rps:
  title: "<#FF5555><bold>Камень, ножницы, бумага</bold> <dark_gray>— <white>Лобби"
ttt:
  title: "<#00FFFF><bold>Крестики-нолики</bold> <dark_gray>— <white>Лобби"

bet-amounts: [100, 500, 1000, 5000, 10000]
