# ═══════════════════════════════════════════════════════
#   menus/blackjack_tutorial.yml — правила игры в блэкджек
# ═══════════════════════════════════════════════════════

title: "<black><bold>📖 Правила блэкджека"
rows: 3

decorations:
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [0, 1, 2, 3, 4, 5, 6, 7, 8, 18, 19, 20, 21, 23, 24, 25, 26]
  - material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: [9, 11, 13, 15, 17]

back-button:
  slot: 22
  material: ARROW
  name: "<red><bold>⬅ НАЗАД</bold>"

pages:
  objetivo:
    slot: 10
    material: BOOK
    name: "<#FFD700><bold>1. ЦЕЛЬ ИГРЫ</bold>"
    lore:
      - "<gray>Ваша цель — победить <#FF5555>дилера</#FF5555>."
      - "<gray>Для этого сумма очков ваших карт"
      - "<gray>должна быть ближе к <#00FF7F>21</#00FF7F>, чем у дилера,"
      - "<gray>но не должна превышать 21 (перебор)!"

  valor-cartas:
    slot: 12
    material: PAPER
    name: "<#00FF7F><bold>2. СТОИМОСТЬ КАРТ</bold>"
    lore:
      - "<white>• Карты 2–10: <gray>номинал карты."
      - "<white>• Валет, дама, король: <gray>10 очков."
      - "<white>• Туз: <gray>1 или 11 очков"
      - "<gray>  (игра выберет наиболее выгодный вариант)."

  acciones:
    slot: 14
    material: COMPASS
    name: "<#00FFFF><bold>3. ВАШИ ДЕЙСТВИЯ</bold>"
    lore:
      - "<#00FF7F>✚ Взять карту: <gray>получить ещё одну карту."
      - "<#FF5555>✋ Хватит: <gray>оставить текущую руку."
      - "<#FFD700>💰 Удвоить: <gray>удвоить ставку,"
      - "<gray>взять только ОДНУ карту и завершить ход."

  pagos:
    slot: 16
    material: GOLD_INGOT
    name: "<#FFD700><bold>4. ВЫПЛАТЫ</bold>"
    lore:
      - "<white>• Обычная победа: <gray>выплата 1 к 1 (вы получите x2 ставки)."
      - "<white>• Блэкджек (21 на первых двух картах): <gray>выплата 3 к 2 (вы получите x2,5 ставки)."
      - "<white>• Ничья: <gray>ставка возвращается."
      - "<white>• Проигрыш или перебор: <gray>ставка сгорает."
