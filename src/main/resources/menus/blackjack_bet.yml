# ═══════════════════════════════════════════════════════
#   menus/blackjack_bet.yml — меню ставки в блэкджеке
# ═══════════════════════════════════════════════════════

title-solo: "<black><bold>Ставка ➔ Одиночная игра"
title-multi: "<black><bold>Ставка ➔ Игра с игроками"
rows: 3

decorations:
  # Верхний ряд
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  # Боковые панели
  - material: GRAY_STAINED_GLASS_PANE
    name: " "
    slots: [9, 17]
  # Нижний ряд
  - material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: [18, 19, 20, 21, 23, 24, 25, 26]

buttons:
  minus-big:
    slot: 10
    material: RED_DYE
    label: "-10k"
    amount: -10000.0
    color: "<#FF3333>"
  minus-medium:
    slot: 11
    material: RED_DYE
    label: "-1k"
    amount: -1000.0
    color: "<#FF3333>"
  minus-small:
    slot: 12
    material: RED_DYE
    label: "-100"
    amount: -100.0
    color: "<#FF3333>"

  plus-small:
    slot: 14
    material: LIME_DYE
    label: "+100"
    amount: 100.0
    color: "<#00FF7F>"
  plus-medium:
    slot: 15
    material: LIME_DYE
    label: "+1k"
    amount: 1000.0
    color: "<#00FF7F>"
  plus-big:
    slot: 16
    material: LIME_DYE
    label: "+10k"
    amount: 10000.0
    color: "<#00FF7F>"

  custom-bet:
    slot: 4
    material: PAPER
    name: "<#FFD700>Своя ставка"

  confirm:
    slot: 13
    material: EMERALD_BLOCK
    name: "<#00FF7F><bold>✔ НАЧАТЬ ИГРУ ✔</bold>"
    lore-bet: "<gray>Начальная ставка: <#FFD700>${amount}"

  max-bet:
    slot: 22
    material: GOLD_BLOCK
    name: "<#FFD700><bold>✦ МАКСИМАЛЬНАЯ СТАВКА ({max}) ✦</bold>"
