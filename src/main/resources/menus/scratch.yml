# В заголовке используется подстановка {tier}
title: "<#FFD700><bold>🎟 СКРЕТЧ-КАРТА {tier} 🎟</bold>"

filler:
  material: BLACK_STAINED_GLASS_PANE

decorations: []

scratch-block:
  material: BLACK_CONCRETE
  name: "<#E0E0E0><bold>⬛ Сотрите здесь!</bold>"
