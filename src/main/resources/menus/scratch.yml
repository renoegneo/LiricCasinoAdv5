  lore:
    - "<#E0E0E0>Нажмите <#00FF7F><bold>ПКМ</bold> <#E0E0E0>по воздуху"
    - "<#E0E0E0>Используйте этот билет, чтобы сыграть.</#E0E0E0>"
    - ""
    - "<#FFB400>Соберите {matches} одинаковых приза для выигрыша!</#FFB400>"
