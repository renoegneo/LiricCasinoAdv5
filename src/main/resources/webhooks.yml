# ─── Вебхуки Discord ──────────────────────────────────────
webhooks:
  enabled: false   # Установите true, чтобы включить вебхуки

  # ── Джекпот (автомат 777 с множителем x100 и т. п.) ──────
  jackpot:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    # Цвет встраиваемого сообщения в десятичном формате (0xFF00FF = пурпурный)
    color: 16711935
    title: "🎰 ДЖЕКПОТ 777!"
    description: "**{player}** выбил **777** в игровом автомате и выиграл **{amount}**! 🤑"
    footer: "Казино Liric • Автоматы"
    # Упоминание роли (оставьте пустым, чтобы не упоминать): "@everyone" или "<@&ROLE_ID>"
    mention-role: ""

  # ── Крупный выигрыш (любая игра, сумма выше min-amount) ──
  big-win:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "💰 Крупный выигрыш!"
    description: "**{player}** выиграл **{amount}** в игре **{game}**! 🎉"
    footer: "Казино Liric"
    mention-role: ""
    # Срабатывает, только если выигрыш превышает эту сумму
    min-amount: 50000.0

  # ── Победитель лотереи ─────────────────────────────────
  lottery:
    url: "https://discord.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
    color: 16766720
    title: "🎟 Победитель лотереи!"
    description: "**{player}** угадал число **{number}** и выиграл **{amount}**! 🎟✨"
    footer: "Казино Liric • Лотерея"
    mention-role: ""
