name: CasinoLiric
version: '${version}'
main: liric.casino.CasinoPlugin
api-version: '26.3'
description: Казино-мини-игры с поддержкой экономики Vault
authors: [Pumpkings]
depend: [Vault, packetevents]
softdepend: [PlaceholderAPI]

commands:
  casino:
    description: Основная команда CasinoLiric
    usage: /casino [game|stats|top|reload]
  roulette:
    description: Команда рулетки
    aliases: [roulette]
  scratch:
    description: Команда скретч-карт
    aliases: [ticket]
  slots:
    description: Команда игровых автоматов
    aliases: [slots, '777']
  poker:
    description: Команда покера
  blackjack:
    description: Команда блэкджека
    aliases: [bj, '21']
  lottery:
    description: Команда лотереи
    aliases: [lottery]
  coinflip:
    description: Команда игры «Орёл или решка»
  cf:
    description: Короткая команда игры «Орёл или решка»
  rps:
    description: Команда игры «Камень, ножницы, бумага»
  ttt:
    description: Команда игры «Крестики-нолики»
    aliases: [tictactoe]
  racing:
    description: Команда скачек
    aliases: [races]

permissions:
  casino.admin:
    description: Доступ к командам администрирования CasinoLiric
    default: op
